[project]
name = "labutopia-dgx-spark"
version = "0.1.0"
description = "LabUtopia on DGX Spark (aarch64, GB10) with Isaac Sim 5.1 and CUDA 13 PyTorch"
requires-python = "==3.11.*"
dependencies = [
  "isaacsim[all,extscache]==5.1.0",
  "torch==2.10.0",
  "torchvision==0.25.0",
  "torchaudio==2.10.0",
  # repo/requirements.txt
  "hydra-core==1.3.2",
  "omegaconf==2.3.0",
  "h5py==3.15.1",
  "numcodecs==0.16.5",
  "opencv-python==4.9.0.80",
  "pandas==2.3.3",
  "scipy==1.15.3",
  "zarr==3.1.5",
  "tqdm==4.67.1",
  "einops==0.8.1",
  "wandb==0.23.1",
  "threadpoolctl==3.6.0",
  "matplotlib==3.10.3",
  "dill==0.4.0",
  "pydantic==2.11.10",
  "rtree==1.3.0",
  "diffusers==0.35.2",
  "pytorch-lightning==1.9.5",
  "lightning-bolts==0.7.0",
  "tyro==0.8.5",
  "typing_extensions==4.12.2",
  "numpy==1.26.0",
  "sentry-sdk==2.29.1",
  "ipython>=9.10.1",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]
# isaacsim-core 5.1 pins torch 2.7.0/cu128; GB10 needs CUDA 13 builds, which start at these versions.
override-dependencies = [
  "torch==2.10.0",
  "torchvision==0.25.0",
  "torchaudio==2.10.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
